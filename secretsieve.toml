# SecretSieve example configuration - copy to ./secretsieve.toml and adjust.
# https://3rabdev.online - Copyright (c) 3rabDev. Licensed under the MIT License.

[scan]
exclude = []
include = []
follow_symlinks = false
max_file_bytes = 5242880
max_line_len = 102400
respect_gitignore = false

[output]
format = "human"
severity_floor = "low"
fail_on = "low"
min_confidence = 0
no_color = false

[entropy]
base64_threshold = 4.5
hex_threshold = 3.7
mixed_threshold = 4.0
min_length = 16

[rules]
disabled = []

[allow]
placeholder_values = []

[advanced]
max_candidates_per_file = 500
max_findings_per_file = 100
