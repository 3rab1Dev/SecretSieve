[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretsieve"
version = "1.0.0"
description = "SecretSieve - intelligent local-first secret detection CLI. Sieve the secrets out of your source."
readme = "README.md"
authors = [{ name = "3rabDev", email = "hi@3rabdev.online" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["security", "secrets", "scanner", "credentials", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://3rabdev.online"

[project.scripts]
secretsieve = "secretsieve.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secretsieve"]

[tool.hatch.build]
artifacts = ["assets/icon.webp", "README.md", "PLAN.md", "secretsieve.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["secretsieve"]
branch = true
